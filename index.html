<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #fff1f1;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: #e8a0a0;
  font-size: 12px;
  opacity: 0.6;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Screens */
.screen {
  display: none;
}
.active {
  display: block;
}

/* Envelope */
.envelope {
  width: 130px;
  height: 90px;
  border: 2px solid #e38b8b;
  background: #ffe6e6;
  margin: auto;
  position: relative;
  cursor: pointer;
}

.envelope:before,
.envelope:after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top: 2px solid #e38b8b;
}

.envelope:before {
  transform: rotate(45deg);
  transform-origin: top left;
}

.envelope:after {
  transform: rotate(-45deg);
  transform-origin: top right;
}

.envelope span {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #e25555;
}

/* Text */
.title {
  margin-top: 12px;
  font-size: 14px;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

/* Buttons */
button {
  padding: 10px 22px;
  margin: 10px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #6fcf97;
  color: white;
}

.no {
  background: #eb5757;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<!-- Floating hearts generator -->
<script>
for (let i = 0; i < 60; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "♡";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.appendChild(h);
}
</script>

<!-- SCREEN 1 -->
<div id="home" class="screen active">
  <div class="envelope" onclick="openLetter()">
    <span>♥</span>
  </div>
  <div class="title">♡ Letter for You ♡</div>
  <div class="sub">Tap to open 💌</div>
</div>

<!-- SCREEN 2 -->
<div id="coffee" class="screen">
  <p>Coffee thak u c ☕</p>

  <button class="yes" onclick="goFinal()">YES 😊</button>
  <button class="no" onmouseover="moveNo(this)">NO 😅</button>
</div>

<!-- SCREEN 3 -->
<div id="final" class="screen">
  <p>
    thabak chtlabo? college chtlena haijandrasu yare khnge 😅<br>
    message thrk o wari ama leege!
  </p>

  <button class="yes">YES 😊</button>
  <button class="no" onmouseover="moveNo(this)">NO 😅</button>
</div>

<script>
function openLetter() {
  home.classList.remove("active");
  coffee.classList.add("active");
}

function goFinal() {
  coffee.classList.remove("active");
  final.classList.add("active");
}

function moveNo(btn) {
  btn.style.left = Math.random() * 80 + "vw";
  btn.style.top = Math.random() * 80 + "vh";
}
</script>

</body>
</html>
