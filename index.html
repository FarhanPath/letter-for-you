<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: #fff3f3;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* floating hearts */
.heart {
  position: absolute;
  color: #e38b8b;
  font-size: 12px;
  opacity: 0.6;
  animation: float 8s linear infinite;
}

@keyframes float {
  from {
    transform: translateY(100vh);
  }
  to {
    transform: translateY(-10vh);
  }
}

/* container */
.container {
  text-align: center;
  z-index: 2;
}

/* envelope */
.envelope {
  width: 120px;
  height: 80px;
  border: 2px solid #e38b8b;
  position: relative;
  margin: auto;
  cursor: pointer;
  background: #ffecec;
}

.envelope:before,
.envelope:after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top: 2px solid #e38b8b;
}

.envelope:before {
  transform: rotate(45deg);
  transform-origin: top left;
}

.envelope:after {
  transform: rotate(-45deg);
  transform-origin: top right;
}

.heart-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #e25555;
  font-size: 14px;
}

/* text */
.title {
  margin-top: 12px;
  font-size: 14px;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

/* letter screen */
#letter {
  display: none;
  text-align: center;
  padding: 20px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #6fcf97;
  color: white;
}

.no {
  background: #eb5757;
  color: white;
}
</style>
</head>

<body>

<!-- hearts -->
<script>
for (let i = 0; i < 50; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "♡";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = 5 + Math.random() * 5 + "s";
  document.body.appendChild(h);
}
</script>

<!-- screen 1 -->
<div class="container" id="home">
  <div class="envelope" onclick="openLetter()">
    <div class="heart-center">♥</div>
  </div>
  <div class="title">♡ Letter for You ♡</div>
  <div class="sub">Tap to open 💌</div>
</div>

<!-- screen 2 -->
<div id="letter">
  <p>
    thabak chtkhibadagi busy ym oikhre<br>
    message fw yngkhidre<br><br>
    Coffee thak u c ☕
  </p>

  <button class="yes" onclick="yesClick()">YES 😊</button>
  <button class="no" onmouseover="moveNo(this)">NO 😅</button>

  <p id="reply"></p>
</div>

<script>
function openLetter() {
  document.getElementById("home").style.display = "none";
  document.getElementById("letter").style.display = "block";
}

function yesClick() {
  document.getElementById("reply").innerHTML =
    "Thank you 💛<br>Pressure oina nattaduna,<br>Just happy you said yes 😊🌸";
}

function moveNo(btn) {
  btn.style.position = "absolute";
  btn.style.left = Math.random() * 80 + "vw";
  btn.style.top = Math.random() * 80 + "vh";
}
</script>

</body>
</html>
