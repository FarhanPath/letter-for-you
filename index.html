<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #fff1f1, #ffe6eb);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  display: none;
  text-align: center;
}

.active {
  display: block;
}

/* Card style */
.card {
  background: white;
  padding: 40px 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  max-width: 340px;
  width: 85%;
}

/* Envelope */
.envelope {
  width: 160px;
  height: 110px;
  border: 3px solid #e07a7a;
  margin: 0 auto 20px;
  position: relative;
  cursor: pointer;
  border-radius: 6px;
  animation: pulse 1.8s infinite;
}

.envelope::before {
  content: "";
  position: absolute;
  inset: 0;
  border-top: 3px solid #e07a7a;
  transform: rotate(45deg);
  transform-origin: top left;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

button {
  padding: 12px 26px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  margin: 10px;
  cursor: pointer;
}

#yes {
  background: #2ecc71;
  color: black;
}

#no {
  background: #e74c3c;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="s1" class="screen active">
  <div class="card">
    <div class="envelope" onclick="openQuestion()"></div>
    <p>♡ Letter for You ♡</p>
    <small>Tap to open 💌</small>
  </div>
</div>

<!-- SCREEN 2 -->
<div id="s2" class="screen">
  <div class="card">
    <h3>
      thabak chtkhibadagi busy ym oikhre<br>
      message fw yngkhidre<br><br>
      Coffee thak u c ☕
    </h3>
    <br>
    <button id="yes" onclick="yesClicked()">YES 😊</button>
    <button id="no" onmouseover="moveNo()">NO 😅</button>
  </div>
</div>

<!-- SCREEN 3 -->
<div id="s3" class="screen">
  <div class="card">
    <h3>
      Delhi dagi ngga unaba fangani na<br>
      lk e ni matam fangdre khangni<br>
      ng adu nhak t matam kheidok<br>
      o ig da reply tourko
    </h3>
  </div>
</div>

<script>
function openQuestion() {
  document.getElementById("s1").classList.remove("active");
  document.getElementById("s2").classList.add("active");
}

function yesClicked() {
  document.getElementById("s2").classList.remove("active");
  document.getElementById("s3").classList.add("active");
}

function moveNo() {
  const no = document.getElementById("no");
  no.style.left = Math.random() * 70 + "vw";
  no.style.top = Math.random() * 70 + "vh";
}
</script>

</body>
</html>
