<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #fff7f7;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 12px;
  color: #f28ca6;
  animation: float 8s linear infinite;
  opacity: 0.6;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Screens */
.screen {
  display: none;
  text-align: center;
  z-index: 2;
}
.active { display: block; }

/* Envelope */
.envelope {
  width: 120px;
  height: 80px;
  border: 2px solid #e07a7a;
  background: #ffecec;
  margin: auto;
  position: relative;
  cursor: pointer;
}

.envelope::before,
.envelope::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top: 2px solid #e07a7a;
}

.envelope::before {
  transform: rotate(45deg);
  transform-origin: top left;
}
.envelope::after {
  transform: rotate(-45deg);
  transform-origin: top right;
}

.heart-center {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  color: #e25555;
}

button {
  padding: 10px 22px;
  font-size: 14px;
  border: none;
  border-radius: 6px;
  margin: 10px;
  cursor: pointer;
}

#yes { background: #7ed957; }
#no {
  background: #ff6b6b;
  position: absolute;
}
</style>
</head>

<body>

<!-- Hearts -->
<script>
for (let i = 0; i < 40; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "♡";
  h.style.left = Math.random()*100 + "vw";
  h.style.animationDuration = (5 + Math.random()*5) + "s";
  document.body.appendChild(h);
}
</script>

<!-- SCREEN 1 -->
<div id="s1" class="screen active">
  <div class="envelope" onclick="openLetter()">
    <div class="heart-center">♥</div>
  </div>
  <p>♡ Letter for You ♡</p>
</div>

<!-- SCREEN 2 -->
<div id="s2" class="screen">
  <p>
    thabak chtkhibadagi busy ym oikhre<br>
    message fw yngkhidre<br>
    Coffee thak u c ☕
  </p>
  <button id="yes" onclick="yesClick()">YES 😊</button>
  <button id="no" onmouseover="moveNo()">NO 😅</button>
</div>

<!-- SCREEN 3 -->
<div id="s3" class="screen">
  <p>
    Delhi dagi ngga unaba fangani na<br>
    lk e ni matam fangdre khangni<br>
    ng adu nhak t matam kheidok<br>
    o ig da reply tourko
  </p>
</div>

<script>
function openLetter() {
  s1.classList.remove("active");
  s2.classList.add("active");
}
function yesClick() {
  s2.classList.remove("active");
  s3.classList.add("active");
}
function moveNo() {
  no.style.left = Math.random()*80 + "vw";
  no.style.top = Math.random()*80 + "vh";
}
</script>

</body>
</html>
