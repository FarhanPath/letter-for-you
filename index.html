<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    background: #fff1f1;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    font-size: 12px;
    color: #f2a1a1;
    animation: float 8s linear infinite;
    opacity: 0.6;
  }

  @keyframes float {
    from {
      transform: translateY(100vh);
    }
    to {
      transform: translateY(-10vh);
    }
  }

  /* container */
  .container {
    text-align: center;
    padding: 20px;
  }

  /* envelope */
  .envelope {
    width: 120px;
    height: 80px;
    border: 2px solid #e07a7a;
    background: #ffecec;
    margin: 0 auto 12px;
    position: relative;
    cursor: pointer;
  }

  .envelope::before,
  .envelope::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-top: 2px solid #e07a7a;
    top: 0;
  }

  .envelope::before {
    transform: rotate(45deg);
    transform-origin: top left;
  }

  .envelope::after {
    transform: rotate(-45deg);
    transform-origin: top right;
  }

  .heart-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #e25555;
    font-size: 14px;
  }

  .title {
    font-size: 14px;
    margin-top: 6px;
  }

  .subtitle {
    font-size: 12px;
    opacity: 0.7;
  }

  /* message screen */
  .message {
    display: none;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 10px;
  }
</style>
</head>

<body>

<!-- hearts -->
<script>
  for (let i = 0; i < 40; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "♡";
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDelay = Math.random() * 8 + "s";
    h.style.fontSize = (10 + Math.random() * 8) + "px";
    document.body.appendChild(h);
  }
</script>

<div class="container">
  <div class="envelope" onclick="openLetter()">
    <div class="heart-center">♥</div>
  </div>

  <div class="title">♡ Letter for You ♡</div>
  <div class="subtitle">Tap to open 💌</div>

  <div class="message" id="msg">
    thabak chtlabo? college chtlena haijandrasu yare khnge 😅<br>
    nggi matam adu kheidok o,<br>
    message thrk o wari ama leege.
  </div>
</div>

<script>
  function openLetter() {
    document.querySelector(".envelope").style.display = "none";
    document.querySelector(".subtitle").style.display = "none";
    document.getElementById("msg").style.display = "block";
  }
</script>

</body>
  </html>
