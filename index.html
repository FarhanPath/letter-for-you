<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #fff6f6;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Floating hearts background */
.heart {
  position: absolute;
  color: #e8a0b0;
  font-size: 10px;
  opacity: 0.6;
  animation: float 10s linear infinite;
}

@keyframes float {
  from { transform: translateY(110vh); }
  to { transform: translateY(-10vh); }
}

/* Center container */
.container {
  text-align: center;
  z-index: 2;
}

/* Pixel envelope */
.envelope {
  width: 120px;
  height: 80px;
  background: #ffe2e2;
  border: 3px solid #e07a7a;
  position: relative;
  margin: auto;
  cursor: pointer;
}

/* Envelope X lines */
.envelope::before,
.envelope::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-top: 3px solid #e07a7a;
}

.envelope::before {
  transform: rotate(45deg);
  transform-origin: left top;
}

.envelope::after {
  transform: rotate(-45deg);
  transform-origin: right top;
}

/* Pixel heart */
.heart-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #d85c5c;
  font-size: 16px;
}

/* Text */
.text {
  margin-top: 10px;
  font-size: 14px;
  color: #444;
}
</style>
</head>

<body>

<!-- Hearts -->
<script>
for (let i = 0; i < 60; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "♡";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  h.style.fontSize = (8 + Math.random() * 6) + "px";
  document.body.appendChild(h);
}
</script>

<!-- Main -->
<div class="container">
  <div class="envelope" onclick="openLetter()">
    <div class="heart-center">♥</div>
  </div>
  <div class="text">♡ Letter for You ♡</div>
</div>

<script>
function openLetter() {
  alert("Letter opened 💌");
}
</script>

</body>
</html>
