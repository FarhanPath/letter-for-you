<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter for You 💌</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #fff3f3;
  font-family: "Courier New", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: #e89a9a;
  font-size: 14px;
  opacity: 0.8;
  animation: float linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

/* Screens */
.screen {
  display: none;
}
.active {
  display: block;
}

/* Envelope container */
.envelope {
  width: 160px;
  height: 110px;
  background: #ffe1e1;
  border: 3px solid #e07a7a;
  position: relative;
  margin: auto;
  cursor: pointer;
}

/* Envelope flap */
.envelope:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  clip-path: polygon(0 0, 50% 55%, 100% 0);
  border-bottom: 3px solid #e07a7a;
}

/* Heart seal */
.seal {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  color: #d85b5b;
}

/* Text */
.title {
  margin-top: 14px;
  font-size: 15px;
}

.sub {
  font-size: 12px;
  opacity: 0.7;
}

/* Buttons */
button {
  padding: 10px 24px;
  margin: 10px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

.yes {
  background: #6fcf97;
  color: white;
}

.no {
  background: #eb5757;
  color: white;
  position: absolute;
}
</style>
</head>

<body>

<!-- Hearts -->
<script>
for (let i = 0; i < 90; i++) {
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "♡";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  h.style.fontSize = 10 + Math.random() * 8 + "px";
  document.body.appendChild(h);
}
</script>

<!-- SCREEN 1 -->
<div id="home" class="screen active">
  <div class="envelope" onclick="openLetter()">
    <div class="seal">♥</div>
  </div>
  <div class="title">♡ Letter for You ♡</div>
  <div class="sub">Tap to open 💌</div>
</div>

<!-- SCREEN 2 -->
<div id="coffee" class="screen">
  <p>Coffee thak u c ☕</p>
  <button class="yes" onclick="goFinal()">YES 😊</button>
  <button class="no" onmouseover="moveNo(this)">NO 😅</button>
</div>

<!-- SCREEN 3 -->
<div id="final" class="screen">
  <p>
    thabak chtlabo? college chtlena haijandrasu yare khnge 😅<br>
    message thrk o wari ama leege!
  </p>
  <button class="yes">YES 😊</button>
  <button class="no" onmouseover="moveNo(this)">NO 😅</button>
</div>

<script>
function openLetter() {
  home.classList.remove("active");
  coffee.classList.add("active");
}

function goFinal() {
  coffee.classList.remove("active");
  final.classList.add("active");
}

function moveNo(btn) {
  btn.style.left = Math.random() * 80 + "vw";
  btn.style.top = Math.random() * 80 + "vh";
}
</script>

</body>
</html>
